# Configuración de la base compartida del servicio.
#
# Va en un archivo y no en flags sueltos del `docker run` por dos razones: las
# decisiones quedan versionadas y explicadas (que es lo que se evalúa), y un
# `docker run` de seis líneas no se puede leer en la demo.
#
# La contraseña NO está acá: la agrega levantar.sh al vuelo, leyéndola del .env,
# en un archivo aparte que no se versiona. Este archivo se puede publicar entero.

# --- Red -------------------------------------------------------------------

port 6379

# Adentro del contenedor escucha en todas las interfaces. Quién llega hasta acá
# no lo decide Redis sino el `-p` del docker run, que publica el puerto SÓLO en
# la IP de Tailscale: desde afuera del tailnet la base no existe. Poner acá la IP
# del host no serviría, porque es una IP que el contenedor no tiene.
bind 0.0.0.0

# Con requirepass puesto, protected-mode no cambia nada; queda explícito para que
# se note que no se apagó, que es el atajo habitual cuando "no conecta".
protected-mode yes

# --- Persistencia ----------------------------------------------------------
# El enunciado pide que el estado sobreviva al reparto entre réplicas. Que
# sobreviva también a un reinicio de la base es la otra mitad: sin esto, un
# `docker restart` borra todas las personas y la demo de estado compartido se cae
# sin que nadie toque una réplica.

dir /data

# AOF: cada escritura queda en un log que se reproduce al arrancar. Es el modo
# durable de Redis; los snapshots solos pierden todo lo posterior al último.
appendonly yes

# everysec y no always: `always` hace un fsync por escritura y ahí el alta de una
# persona pasa a costar lo que tarde el disco. `everysec` arriesga como mucho un
# segundo de escrituras contra un corte de luz, que para esta materia es el
# intercambio correcto — y es justamente el tipo de decisión que hay que poder
# defender, no esconder.
appendfsync everysec

# Snapshots además del AOF: arrancar desde un RDB es mucho más rápido que
# reproducir el log entero, y sirve de copia si el AOF se corrompe.
save 900 1
save 300 10
save 60 10000

# Si un snapshot falla (disco lleno, por ejemplo), Redis deja de aceptar
# escrituras en vez de seguir como si nada. Preferimos que el alta falle a la
# vista de todos antes que aceptarla y perderla en silencio.
stop-writes-on-bgsave-error yes

# --- Memoria ---------------------------------------------------------------

# Techo para que la base no se coma la máquina donde también corren el
# balanceador, el CI/CD y una réplica.
maxmemory 256mb

# LA decisión importante de este archivo. Con cualquier política de expiración
# (allkeys-lru y compañía), Redis al llenarse BORRA personas viejas para hacer
# lugar, sin avisar: el servicio seguiría respondiendo 200 mientras pierde datos.
# Con noeviction, la escritura falla, la app devuelve UNAVAILABLE y el problema
# se ve. Una base de registros no es un caché.
maxmemory-policy noeviction

# --- Registro --------------------------------------------------------------

# Vacío = stdout, así el log sale por `docker logs sdypp-redis` y se lo puede
# proyectar en la demo al lado de las bitácoras de las réplicas.
logfile ""
loglevel notice
